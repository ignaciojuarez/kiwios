<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070908">
  <title>KiwiOS</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside>
      <a class="brand" href="#home" aria-label="KiwiOS home">
        <img class="brand-mark" src="/icon-192.png" width="34" height="34" alt="" aria-hidden="true">
        <span class="brand-copy">
          <span class="brand-name">KIWI.OS</span>
          <span class="brand-detail">Mac mini control</span>
        </span>
      </a>
      <nav id="navigation" aria-label="KiwiOS"></nav>
      <div id="viewer" class="viewer"></div>
    </aside>
    <main>
      <header>
        <button id="back" class="quiet hidden" type="button">← Back</button>
        <div class="header-title">
          <p id="eyebrow">System / Overview</p>
          <h1 id="title">Home</h1>
        </div>
        <div id="page-actions" class="page-actions" aria-label="Page actions"></div>
        <span id="connection" class="connection">Connecting</span>
      </header>
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="content" aria-busy="true"></section>
    </main>
  </div>
  <dialog id="confirmation" aria-labelledby="confirmation-title">
    <div>
      <h2 id="confirmation-title">Run action?</h2>
      <p id="confirmation-detail"></p>
      <div class="dialog-actions">
        <button id="cancel-confirmation" type="button" class="quiet">Cancel</button>
        <button id="confirm-action" type="button">Run action</button>
      </div>
    </div>
  </dialog>
  <dialog id="widget-picker" aria-labelledby="widget-picker-title">
    <div class="widget-picker-header">
      <h2 id="widget-picker-title">Add a widget</h2>
      <p>Choose an active plugin widget for Home.</p>
    </div>
    <div id="widget-picker-list" class="widget-picker-list" aria-label="Available widgets"></div>
    <form method="dialog" class="dialog-actions"><button class="quiet" value="close">Close</button></form>
  </dialog>
  <dialog id="plugin-install" aria-labelledby="plugin-install-title">
    <form id="plugin-install-form" method="dialog">
      <h2 id="plugin-install-title">Add plugin</h2>
      <label for="plugin-repository">GitHub repository URL</label>
      <input id="plugin-repository" type="url" required autocomplete="off" maxlength="256" placeholder="https://github.com/owner/repository">
      <div class="dialog-actions">
        <button id="plugin-install-cancel" type="button" class="quiet">Cancel</button>
        <button value="default">Add</button>
      </div>
    </form>
  </dialog>
  <dialog id="plugin-configuration" aria-labelledby="plugin-configuration-title">
    <div id="plugin-configuration-content"></div>
  </dialog>
</body>
</html>
