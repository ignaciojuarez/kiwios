<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070908">
  <title>KiwiOS</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside>
      <a class="brand" href="#home" aria-label="KiwiOS home">
        <img class="brand-mark" src="/icon-192.png" width="34" height="34" alt="" aria-hidden="true">
        <span class="brand-copy">
          <span class="brand-name">KIWI.OS</span>
          <span class="brand-detail">Mac mini control</span>
        </span>
      </a>
      <nav id="navigation" aria-label="KiwiOS"></nav>
      <div id="viewer" class="viewer"></div>
    </aside>
    <main>
      <header>
        <button id="back" class="quiet hidden" type="button">← Back</button>
        <div>
          <p id="eyebrow">System / Overview</p>
          <h1 id="title">Home</h1>
        </div>
        <span id="connection" class="connection">Connecting</span>
      </header>
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="content" aria-busy="true"></section>
    </main>
  </div>
  <dialog id="confirmation" aria-labelledby="confirmation-title">
    <form method="dialog">
      <h2 id="confirmation-title">Run action?</h2>
      <p id="confirmation-detail"></p>
      <div class="dialog-actions">
        <button value="cancel" class="quiet">Cancel</button>
        <button id="confirm-action" value="default">Run action</button>
      </div>
    </form>
  </dialog>
  <dialog id="dependency-alert" aria-labelledby="dependency-title">
    <form method="dialog">
      <h2 id="dependency-title">Install dependencies on the Mac</h2>
      <p id="dependency-detail"></p>
      <div class="dialog-actions"><button value="close">Close</button></div>
    </form>
  </dialog>
  <dialog id="widget-picker" aria-labelledby="widget-picker-title">
    <div class="widget-picker-header">
      <h2 id="widget-picker-title">Add a widget</h2>
      <p>Choose an active plugin widget for Home.</p>
    </div>
    <div id="widget-picker-list" class="widget-picker-list" aria-label="Available widgets"></div>
    <form method="dialog" class="dialog-actions"><button class="quiet" value="close">Close</button></form>
  </dialog>
</body>
</html>
