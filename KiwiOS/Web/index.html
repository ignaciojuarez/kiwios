<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111612">
  <title>KiwiOS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside>
      <a class="brand" href="#home" aria-label="KiwiOS home"><span class="mark">K</span><span>KiwiOS</span></a>
      <nav id="navigation" aria-label="Plugins"></nav>
      <div id="viewer" class="viewer"></div>
    </aside>
    <main>
      <header><button id="back" class="quiet hidden" type="button">Back</button><div><p id="eyebrow">Mac mini hub</p><h1 id="title">Home</h1></div><span id="connection" class="connection">Connecting</span></header>
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="content" aria-live="polite" aria-busy="true"></section>
    </main>
  </div>
  <dialog id="confirmation" aria-labelledby="confirmation-title">
    <form method="dialog">
      <p class="eyebrow">Confirmation required</p>
      <h2 id="confirmation-title">Run action?</h2>
      <p id="confirmation-detail">Review this action before continuing.</p>
      <div class="dialog-actions"><button value="cancel" class="quiet">Cancel</button><button id="confirm-action" value="default">Run action</button></div>
    </form>
  </dialog>
</body>
</html>
