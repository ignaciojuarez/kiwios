name: KiwiOS
packages:
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    exactVersion: 2.26.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0
  Subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    exactVersion: 1.0.0
  TOMLDecoder:
    url: https://github.com/dduan/TOMLDecoder.git
    exactVersion: 0.4.5
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  KiwiOS:
    type: application
    platform: macOS
    sources:
      - path: KiwiOS
        excludes: [Web]
      - path: KiwiOS/Web
        type: folder
        buildPhase: resources
      - path: plugins
        type: folder
        buildPhase: resources
      - path: catalog
        type: folder
        buildPhase: resources
    dependencies:
      - package: Hummingbird
      - package: GRDB
      - package: Subprocess
      - package: TOMLDecoder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.kiwios
      PRODUCT_NAME: KiwiOS
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: KiwiOS
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      INFOPLIST_KEY_NSHighResolutionCapable: YES
      INFOPLIST_KEY_NSRemovableVolumesUsageDescription: KiwiOS reads drive health and capacity for plugins you add.
      CODE_SIGN_STYLE: Automatic
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      SWIFT_EMIT_LOC_STRINGS: YES
  KiwiOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KiwiOSTests
    dependencies:
      - target: KiwiOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
