id = "monitor"
name = "Monitor"
description = "CPU, memory, thermal pressure, and storage temperatures."
version = "0.3.1"
kiwios_api = "1"
license = "MIT"
brew = ["macmon", "smartmontools"]

[permissions]
exec = ["awk", "diskutil", "ioreg", "macmon", "memory_pressure", "plutil", "pmset", "smartctl", "top"]

[[checks]]
id = "cpu"
label = "CPU usage"
command = ["./monitor.sh", "cpu"]
every = "30s"
timeout = "10s"

[[checks]]
id = "memory"
label = "Memory usage"
command = ["./monitor.sh", "memory"]
every = "30s"
timeout = "10s"

[[checks]]
id = "thermals"
label = "Thermal pressure"
command = ["./monitor.sh", "thermals"]
every = "1m"
timeout = "10s"

[[checks]]
id = "cpu-temperature"
label = "CPU temperature"
command = ["./monitor.sh", "cpu-temperature"]
every = "1m"
timeout = "10s"

[[checks]]
id = "gpu-temperature"
label = "GPU temperature"
command = ["./monitor.sh", "gpu-temperature"]
every = "1m"
timeout = "10s"

[[checks]]
id = "drive-temperatures"
label = "Drive temperatures"
command = ["./monitor.sh", "drive-temperatures"]
every = "1m"
timeout = "20s"

[[ui.pages]]
id = "overview"
title = "Monitor"
kind = "checks"
source = "checks"

[[ui.pages]]
id = "drives"
title = "Drive Temperatures"
kind = "table"
source = "checks.drive-temperatures"

[[ui.sidebar]]
id = "monitor"
label = "Monitor"
page = "overview"

[[ui.widgets]]
id = "cpu"
title = "CPU"
kind = "stat"
source = "checks.cpu"
size = "1x1"

[[ui.widgets]]
id = "memory"
title = "Memory"
kind = "stat"
source = "checks.memory"
size = "1x1"

[[ui.widgets]]
id = "cpu-temperature"
title = "CPU temperature"
kind = "stat"
source = "checks.cpu-temperature"
size = "1x1"

[[ui.widgets]]
id = "gpu-temperature"
title = "GPU temperature"
kind = "stat"
source = "checks.gpu-temperature"
size = "1x1"

[[ui.widgets]]
id = "drive-temperatures"
title = "Hottest drive"
kind = "stat"
source = "checks.drive-temperatures"
size = "1x1"
